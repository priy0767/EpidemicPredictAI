name: Project checks

on:
  push:
    branches: [main, portfolio-audit]
  pull_request:
    branches: [main]

jobs:
  backend-and-ml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q backend ai-pipeline/models
      - name: Run API tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Run ML tests
        working-directory: ai-pipeline/models
        run: python -m unittest discover -s tests -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  historical-model-training:
    # Run the real data download/training once for the portfolio PR, not on
    # every ordinary branch push. This validates source compatibility and
    # exports evaluation reports without committing generated model binaries.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install model dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Download historical public datasets
        working-directory: ai-pipeline/models
        run: python download_datasets.py
      - name: Train country models and generate evaluation reports
        working-directory: ai-pipeline/models
        run: |
          python train_model.py
          python -c "from pathlib import Path; reports=list(Path('.').glob('evaluation_*.json')); print(f'Generated {len(reports)} evaluation reports'); assert reports, 'No country evaluation reports were generated'"
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-model-evaluation-reports
          path: ai-pipeline/models/evaluation_*.json
          if-no-files-found: warn
          retention-days: 14
